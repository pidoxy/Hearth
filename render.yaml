services:
  - type: web
    name: hearth
    runtime: docker
    plan: starter
    healthCheckPath: /api/health
    disk:
      name: hearth-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: DATA_DIR
        value: /data
      - key: APP_URL
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: INBOUND_DOMAIN
        sync: false
      - key: INBOUND_SECRET
        generateValue: true
      - key: CRON_SECRET
        generateValue: true
      - key: SMTP_URL
        sync: false
      - key: MAIL_FROM
        sync: false
