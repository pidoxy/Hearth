name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm test
      - run: npm run build
      - name: End-to-end smoke test
        run: |
          npx playwright install --with-deps chromium
          npm i --no-save playwright
          DATA_DIR=$RUNNER_TEMP/data INBOUND_SECRET=testsecret INBOUND_DOMAIN=in.hearth.test APP_URL=http://localhost:3000 npm start &
          npx wait-on http://localhost:3000/api/health
          INBOUND_SECRET=testsecret node scripts/e2e.mjs

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t hearth .
